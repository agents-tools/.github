name: CI

on:
  push:
    branches: [master]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  organization:
    uses: agents-tools/github-workflows/.github/workflows/organization.yml@ebd6af9164232217e2e243da0d9735544ae3a8f9
    with:
      organization: agents-tools
      declaration-repository: ${{ github.repository }}
      declaration-revision: ${{ github.sha }}
      mode: public
  check:
    needs: organization
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    permissions: {}
    steps:
      - run: test "$RESULT" = success
        env:
          RESULT: ${{ needs.organization.result }}
