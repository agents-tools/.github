name: Shared presentation check

on:
  workflow_call:
    inputs:
      record:
        description: Recording JSON path relative to the caller checkout
        type: string
        default: Documentation/Assets/Demo/record.json
      recipe:
        description: Presentation recipe JSON path relative to the caller checkout
        type: string
        default: Documentation/Assets/Demo/recipe.json
      output-directory:
        description: Directory containing committed Demo-light.svg and Demo-dark.svg, relative to the caller checkout
        type: string
        default: Documentation/Assets/Demo

permissions:
  contents: read

concurrency:
  group: shared-presentation-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  presentation:
    name: presentation
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - name: Validate workflow revision
        env:
          STANDARD_SHA: ${{ job.workflow_sha }}
        run: |
          if [[ ! "$STANDARD_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::GitHub did not provide the reusable workflow commit SHA"
            exit 1
          fi
      - name: Check out caller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: caller
          persist-credentials: false
      - name: Check out pinned standard
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: agents-tools/.github
          ref: ${{ job.workflow_sha }}
          path: standard
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.13'
      - name: Check committed terminal SVGs
        env:
          RECORD: ${{ inputs.record }}
          RECIPE: ${{ inputs.recipe }}
          OUTPUT_DIRECTORY: ${{ inputs.output-directory }}
        run: |
          python -B -E -s "$GITHUB_WORKSPACE/standard/Scripts/vendor/render_terminal.py" \
            --record "$GITHUB_WORKSPACE/caller/$RECORD" \
            --spec "$GITHUB_WORKSPACE/caller/$RECIPE" \
            --output-dir "$GITHUB_WORKSPACE/caller/$OUTPUT_DIRECTORY" \
            --check
